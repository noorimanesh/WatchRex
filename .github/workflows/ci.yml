name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, pdo_sqlite, sqlite3, mbstring, intl, gd, pcntl, sockets
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  quality:
    name: Code style & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (Laravel / PSR-12 style)
        run: vendor/bin/pint --test

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Bash agent syntax
        run: bash -n resources/agent/install.sh && bash -n resources/agent/watchrex-agent.sh

      - name: ShellCheck agent
        run: shellcheck -S error resources/agent/*.sh

      - name: PowerShell agent parses and is ASCII-only (Windows PowerShell 5.1 safe)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem resources/agent/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error "$($f.Name):$($_.Extent.StartLineNumber) $($_.Message)" }; exit 1 }
            if ([System.IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { Write-Error "$($f.Name) contains non-ASCII bytes"; exit 1 }
          }

      - name: Blade templates compile
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache

      - name: Translations are valid JSON
        run: |
          php -r 'foreach (glob("lang/*.json") as $f) { json_decode(file_get_contents($f), flags: JSON_THROW_ON_ERROR); }'
